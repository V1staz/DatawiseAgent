llm:
  llm_type: openai-chat
  # Change this to the exact model id exposed by your provider.
  # Common examples:
  # Official DashScope OpenAI-compatible model ids include qwen-plus, qwen-max,
  # qwen3.5-plus, and qwen3.5-flash. Keep this on a stable general model.
  model: qwen3.5-flash
  temperature: 0
  top_p: 1
  frequency_penalty: 0.0

code_executor:
  # Keep the shared fork on the local no-Docker path for macOS reproduction.
  use_docker: False
  use_proxy: False
  use_gpu: False
